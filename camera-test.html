<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Silent Colors - Camera Diagnostic</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,Arial,sans-serif}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#info{position:fixed;top:max(env(safe-area-inset-top),20px);left:15px;right:15px;padding:12px;background:#001830d9;border-radius:14px;font-size:15px;line-height:1.5}
button{margin-top:10px;padding:12px 16px;border:0;border-radius:12px;background:#fff;color:#071c36;font-weight:700;font-size:17px}
</style></head>
<body><video id="view" autoplay playsinline webkit-playsinline muted></video>
<div id="info"><strong>Rear camera test</strong><div id="status">Tap Open back camera.</div><button id="go">Open back camera</button><button id="end" hidden>Stop camera</button></div>
<script>
let stream=null;
const v=document.getElementById('view'),status=document.getElementById('status');
const go=document.getElementById('go'), end=document.getElementById('end');
go.addEventListener('click',async()=>{
 go.disabled=true;status.textContent='Requesting back camera…';
 try {
  stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'}}});
  v.srcObject=stream;await v.play();
  const track=stream.getVideoTracks()[0];
  status.textContent='Live video size: '+v.videoWidth+' x '+v.videoHeight+' | Camera: '+(track.label||track.getSettings().facingMode||'unknown')+'. If you see your surroundings, camera access works; the black screen in AR is caused elsewhere.';
  go.hidden=true;end.hidden=false;
 } catch(e) {status.textContent='Camera failed: '+e.name+' - '+e.message;go.disabled=false;}
});
end.addEventListener('click',()=>{stream?.getTracks().forEach(t=>t.stop());stream=null;v.srcObject=null;go.hidden=false;go.disabled=false;end.hidden=true;status.textContent='Camera stopped.';});
window.addEventListener('pagehide',()=>stream?.getTracks().forEach(t=>t.stop()));
</script></body></html>
