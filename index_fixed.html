<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Silent Colors AR</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; font-family:Arial,sans-serif; }
    #arScene { position:fixed; inset:0; width:100vw; height:100vh; z-index:1; }
    #startScreen { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; box-sizing:border-box; text-align:center; background:#081b36; color:#fff; }
    #startScreen img { width:min(70vw,360px); border-radius:18px; box-shadow:0 12px 30px rgba(0,0,0,.35); }
    #startButton { padding:16px 34px; border:0; border-radius:14px; font-size:22px; font-weight:700; background:#fff; color:#082449; }
    #status { font-size:14px; opacity:.85; max-width:420px; }
    #hud { position:fixed; inset:0; z-index:10; pointer-events:none; display:none; }
    #closeBtn { position:absolute; top:max(18px, env(safe-area-inset-top)); left:18px; pointer-events:auto; border:0; border-radius:18px; padding:15px 18px; font-size:18px; font-weight:700; background:#fff; color:#0b1f3a; }
    #hint { position:absolute; top:max(18px, env(safe-area-inset-top)); right:18px; max-width:54vw; background:rgba(0,0,0,.72); color:#fff; padding:12px 16px; border-radius:14px; font-size:16px; text-align:center; }
    .a-canvas { width:100vw !important; height:100vh !important; }
  </style>
</head>
<body>
  <div id="startScreen">
    <img src="./assets/silent-colors-target.jpg" alt="Silent Colors artwork" />
    <h1 style="margin:0">Silent Colors AR</h1>
    <p style="margin:0;max-width:480px">Tap Start AR, allow camera access, then point the back camera at the painting.</p>
    <button id="startButton">Start AR</button>
    <div id="status">Make sure your internet connection is active.</div>
  </div>

  <div id="hud">
    <button id="closeBtn">Close AR</button>
    <div id="hint">Point the back camera at the painting</div>
  </div>

  <a-scene
    id="arScene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no;"
    embedded
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false"
    renderer="colorManagement:true; antialias:true; alpha:true;"
  >
    <a-assets timeout="30000">
      <video id="arVideo" src="./assets/silent-colors-video.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-video id="videoPlane" src="#arVideo" position="0 0 0.01" width="1" height="1.23"></a-video>
    </a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector('#arScene');
    const startScreen = document.querySelector('#startScreen');
    const startButton = document.querySelector('#startButton');
    const status = document.querySelector('#status');
    const hud = document.querySelector('#hud');
    const closeBtn = document.querySelector('#closeBtn');
    const target = document.querySelector('#target');
    const video = document.querySelector('#arVideo');

    async function getMindARSystem() {
      if (!scene.hasLoaded) {
        await new Promise(resolve => scene.addEventListener('loaded', resolve, {once:true}));
      }
      return scene.systems['mindar-image-system'];
    }

    startButton.addEventListener('click', async () => {
      startButton.disabled = true;
      status.textContent = 'Starting camera...';
      try {
        const mindarSystem = await getMindARSystem();
        await mindarSystem.start();
        startScreen.style.display = 'none';
        hud.style.display = 'block';
      } catch (e) {
        console.error(e);
        status.textContent = 'Could not start camera. Check Safari camera permission, then reload.';
        startButton.disabled = false;
      }
    });

    closeBtn.addEventListener('click', async () => {
      try {
        const mindarSystem = await getMindARSystem();
        mindarSystem.stop();
      } catch (e) {}
      video.pause();
      hud.style.display = 'none';
      startScreen.style.display = 'flex';
      status.textContent = 'AR closed. Tap Start AR to open it again.';
      startButton.disabled = false;
    });

    target.addEventListener('targetFound', async () => {
      try {
        video.currentTime = 0;
        await video.play();
      } catch (e) {
        console.error(e);
      }
    });

    target.addEventListener('targetLost', () => {
      video.pause();
    });
  </script>
</body>
</html>
