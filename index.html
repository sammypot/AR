<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06162e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Silent Colors | Augmented Reality</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; width:100%; overflow:hidden; background:#000; }
    /* Keep the MindAR stage fully laid out at ALL times, even before Start.
       display:none on an A-Frame scene was a problem in the previous version. */
    #stage { position:fixed; inset:0; width:100%; height:100%; height:100dvh; overflow:hidden; background:#000; }
    #stage video { z-index:0 !important; }
    #stage canvas { z-index:1 !important; background:transparent !important; }
    #cover { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; overflow:auto;
      background:radial-gradient(ellipse at top,#173a66 0%,#081c39 54%,#051328 100%); color:white; padding:24px 20px; text-align:center; }
    #intro { max-width:410px; width:100%; padding:12px 0; }
    #art { display:block; width:min(53vw,230px); max-height:43dvh; object-fit:contain; margin:0 auto 20px; border-radius:14px; box-shadow:0 18px 44px #0007; }
    h1 { font-size:clamp(26px,7vw,34px); margin:0 0 8px; }
    p { line-height:1.48; margin:0 0 20px; color:#dfebfa; }
    button { appearance:none; border:0; cursor:pointer; font:inherit; font-weight:700; border-radius:14px; min-height:48px; }
    button:disabled {opacity:.62;cursor:wait;}
    #start { width:min(100%,330px); padding:15px 24px; font-size:19px; background:#fff; color:#0b284c; box-shadow:0 10px 30px #0005; }
    #cameraTest { display:block; margin:12px auto 0; background:transparent; border:1px solid #7da3ca; padding:11px 18px; color:#eaf4ff; }
    #introStatus { font-size:13px; color:#c7d9ed; min-height:30px; margin:16px auto 0; max-width:340px; white-space:pre-wrap; overflow-wrap:anywhere; }
    .small { font-size:12px; opacity:.72; margin-top:12px; }
    #hud { position:fixed; inset:0; z-index:20; display:none; pointer-events:none; color:white; }
    #topControls { position:absolute; top:calc(env(safe-area-inset-top) + 12px); left:12px; right:12px; display:flex; gap:10px; align-items:flex-start; justify-content:space-between; }
    #close, #testFromAr { pointer-events:auto; background:#ffffffeb; color:#102b4b; padding:12px 13px; font-size:14px; }
    #statusBubble { max-width:57%; padding:12px 12px; text-align:center; background:#071d36c9; border:1px solid #ffffff28; border-radius:14px; font-size:13px; line-height:1.4; }
    #bottomControls { position:absolute; left:12px; right:12px; bottom:calc(env(safe-area-inset-bottom) + 16px); display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end; justify-content:center; }
    #retryPlay, #sound, #testFromAr {pointer-events:auto; border:1px solid #ffffff80; background:#ffffffef; color:#0e2545; padding:11px 15px; font-size:14px; }
    #retryPlay[hidden], #sound[hidden] {display:none;}
    #diagnostics { position:absolute; left:12px; right:12px; bottom:calc(env(safe-area-inset-bottom) + 85px); margin:0 auto; color:white; background:#071d36b0; border-radius:10px; padding:7px 10px; font-size:11px; text-align:center; max-width:560px; white-space:normal; overflow-wrap:anywhere; }
    #testLayer { position:fixed; inset:0; z-index:35; background:#000; display:none; }
    #testVideo {width:100%;height:100%;object-fit:cover;background:#000;}
    #testBanner { position:absolute; top:calc(env(safe-area-inset-top) + 20px); right:12px; left:12px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    #testText { background:#05152bd9; padding:10px 12px; border-radius:12px; color:white; font-size:13px; }
    #endTest {color:#0b284c;background:white;padding:12px 14px;white-space:nowrap;}
    #contentVideo {position:absolute; left:-2px; top:-2px; width:1px; height:1px; opacity:0; pointer-events:none;}
    [hidden] {display:none !important;}
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>
</head>
<body>
  <div id="stage" aria-label="AR camera view"></div>
  <video id="contentVideo" src="./assets/silent-colors-video.mp4" preload="metadata" playsinline webkit-playsinline muted loop></video>

  <div id="cover">
    <section id="intro">
      <img id="art" src="./assets/silent-colors-target.jpg" alt="Silent Colors painting">
      <h1>Silent Colors AR</h1>
      <p>Open your camera, then point the <strong>back camera</strong> at the real painting. The artwork will transform into a video.</p>
      <button id="start" type="button">Start AR</button>
      <button id="cameraTest" type="button">Test back camera</button>
      <div id="introStatus" role="status">Loading AR library…</div>
      <div class="small">Works online on HTTPS. For iPhone, use Safari.</div>
    </section>
  </div>

  <div id="hud">
    <div id="topControls">
      <button id="close" type="button">Close AR</button>
      <div id="statusBubble" role="status" aria-live="polite">Point at the painting</div>
    </div>
    <div id="diagnostics">Camera initializing…</div>
    <div id="bottomControls">
      <button id="retryPlay" type="button" hidden>▶ Play video</button>
      <button id="sound" type="button" hidden>Enable sound</button>
      <button id="testFromAr" type="button">Test camera</button>
    </div>
  </div>

  <div id="testLayer">
    <video id="testVideo" playsinline webkit-playsinline autoplay muted></video>
    <div id="testBanner">
      <div id="testText">Testing camera…</div>
      <button id="endTest" type="button">Done</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-image-three';

    const $ = id => document.getElementById(id);
    const cover = $('cover');
    const stage = $('stage');
    const hud = $('hud');
    const startButton = $('start');
    const introStatus = $('introStatus');
    const statusBubble = $('statusBubble');
    const diagnostics = $('diagnostics');
    const video = $('contentVideo');
    const retryButton = $('retryPlay');
    const soundButton = $('sound');
    const testLayer = $('testLayer');
    const testVideo = $('testVideo');
    const testText = $('testText');
    let tracker = null;
    let targetFound = false;
    let running = false;
    let testStream = null;
    let justUnblockedVideo = false;
    let monitoring = null;

    video.muted = true;
    video.defaultMuted = true;
    video.playsInline = true;
    video.loop = true;
    video.setAttribute('playsinline', '');
    video.setAttribute('webkit-playsinline', '');
    video.setAttribute('muted', '');

    const setStatus = msg => { statusBubble.textContent = msg; };
    const setDiagnostic = msg => { diagnostics.textContent = msg; };
    const showHome = message => {
      cover.style.display = 'flex';
      hud.style.display = 'none';
      if (message) introStatus.textContent = message;
      startButton.disabled = false;
      startButton.textContent = 'Start AR';
    };
    function messageForError(error) {
      const text = String(error?.message || error);
      if (/NotAllowedError|Permission denied|denied/i.test(text)) return 'Camera permission denied. In Safari, allow camera access for this site, then tap Start AR.';
      if (/NotFoundError|DevicesNotFoundError/i.test(text)) return 'No rear camera was found. Please try Safari on a phone with a working camera.';
      if (/NotReadableError|TrackStartError/i.test(text)) return 'The camera is busy. Close other camera apps, then retry.';
      if (/fetch|network|failed to load|load failed/i.test(text)) return 'Could not load AR tracking data. Check that targets.mind is in the repository root and try Wi-Fi.';
      return 'AR could not start: ' + text.slice(0,190);
    }

    async function verifyFile(path) {
      const response = await fetch(path, { method: 'HEAD', cache:'no-store' });
      if (!response.ok) throw new Error(path + ' returned HTTP ' + response.status);
    }

    async function initializeMindAR() {
      if (tracker) return tracker;
      const threeAR = new MindARThree({
        container: stage,
        imageTargetSrc: './targets.mind',
        uiLoading:'no', uiScanning:'no', uiError:'no',
        filterMinCF: 0.001, filterBeta: 100
      });
      const {renderer, scene, camera} = threeAR;
      // Clear only the 3D canvas, letting MindAR's real HTML camera video show through.
      renderer.setClearColor(0x000000, 0);
      renderer.domElement.style.background = 'transparent';
      renderer.domElement.style.pointerEvents = 'none';
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

      const target = threeAR.addAnchor(0);
      const texture = new THREE.VideoTexture(video);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      const height = 2048 / 1668; // EXACT aspect ratio of Silent Colors image target.
      const plane = new THREE.Mesh(
        new THREE.PlaneGeometry(1, height),
        new THREE.MeshBasicMaterial({map:texture, side:THREE.DoubleSide, toneMapped:false})
      );
      plane.position.set(0, 0, 0.01);
      target.group.add(plane);

      target.onTargetFound = async () => {
        targetFound = true;
        setStatus('Painting detected ✓');
        setDiagnostic('Playing the video on top of your painting.');
        soundButton.hidden = false;
        retryButton.hidden = true;
        if (justUnblockedVideo) { justUnblockedVideo = false; }
        try {
          video.currentTime = 0;
          await video.play();
        } catch (error) {
          retryButton.hidden = false;
          setStatus('Painting detected. Tap ▶ Play video.');
          setDiagnostic('iPhone may require a tap to start video playback.');
        }
      };
      target.onTargetLost = () => {
        targetFound = false;
        video.pause();
        setStatus('Point the back camera at the painting');
        setDiagnostic('Hold the full artwork in view, without glare.');
        retryButton.hidden = true;
        soundButton.hidden = true;
      };
      tracker = threeAR;
      return threeAR;
    }

    function updateCameraDiagnostics() {
      if (!running || testStream) return;
      const els = Array.from(stage.querySelectorAll('video'));
      const cameraEl = els.find(v => v.srcObject && v.srcObject.getVideoTracks?.().length);
      if (!cameraEl) {
        setDiagnostic('Waiting for rear-camera video… If this stays black, tap Test camera.');
        return;
      }
      const tracks = cameraEl.srcObject.getVideoTracks();
      const track = tracks[0];
      const size = `${cameraEl.videoWidth || 0} × ${cameraEl.videoHeight || 0}`;
      if (!targetFound) {
        setDiagnostic(`Camera ${track?.readyState || 'starting'} · ${size}. Aim at the full painting. Black screen? Tap Test camera.`);
      }
    }

    async function unlockVideo() {
      // This runs directly from the tap, BEFORE waiting for downloads or camera startup.
      // iOS may still reject playback, in which case ▶ Play video appears on detection.
      video.muted = true;
      video.load();
      const attempt = video.play();
      if (attempt && typeof attempt.then === 'function') {
        attempt.then(() => {
          if (!targetFound) {video.pause();video.currentTime = 0;}
          justUnblockedVideo = true;
        }).catch(() => { /* The visible retry control handles this case. */ });
      }
    }

    async function startAR() {
      if (running || testStream) return;
      startButton.disabled = true;
      startButton.textContent = 'Opening camera…';
      introStatus.textContent = 'Checking files and starting the rear camera…';
      unlockVideo();
      try {
        if (!window.isSecureContext) throw new Error('Please open the HTTPS GitHub Pages address.');
        if (!navigator.mediaDevices?.getUserMedia) throw new Error('This browser does not support camera access. Use Safari.');
        // Fast HEAD checks: GitHub Pages supports HEAD; don't download the whole MP4 here.
        await verifyFile('./targets.mind');
        await verifyFile('./assets/silent-colors-video.mp4');
        const instance = await initializeMindAR();
        await instance.start();
        running = true;
        targetFound = false;
        cover.style.display = 'none';
        hud.style.display = 'block';
        setStatus('Point the back camera at the painting');
        setDiagnostic('Camera started. Aim at the full painting.');
        if (monitoring) clearInterval(monitoring);
        monitoring = setInterval(updateCameraDiagnostics, 1700);
        instance.renderer.setAnimationLoop(() => instance.renderer.render(instance.scene, instance.camera));
        updateCameraDiagnostics();
      } catch (error) {
        console.error('Silent Colors AR start failed:', error);
        try {tracker?.stop();tracker?.renderer.setAnimationLoop(null);} catch (_) {}
        running = false;
        if (monitoring) {clearInterval(monitoring);monitoring = null;}
        showHome(messageForError(error));
      }
    }

    async function stopAR() {
      if (monitoring) {clearInterval(monitoring);monitoring = null;}
      running = false;
      targetFound = false;
      retryButton.hidden = true;
      soundButton.hidden = true;
      video.pause();
      video.muted = true;
      try {tracker?.renderer.setAnimationLoop(null);tracker?.stop();} catch (e) {console.warn('Stop AR:',e);}
      showHome('Ready to scan again.');
    }

    async function startCameraTest() {
      if (running) await stopAR();
      testLayer.style.display = 'block';
      cover.style.display = 'none';
      hud.style.display = 'none';
      testText.textContent = 'Opening rear camera test…';
      try {
        if (!navigator.mediaDevices?.getUserMedia) throw new Error('Camera API is unavailable in this browser.');
        testStream = await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'}}});
        testVideo.srcObject = testStream;
        testVideo.muted = true;
        await testVideo.play();
        const track = testStream.getVideoTracks()[0];
        testText.textContent = `Camera test: ${track.getSettings().facingMode || 'camera'} · If you see the room, camera hardware is OK.`;
      } catch (error) {
        testText.textContent = 'Camera test failed: ' + messageForError(error);
      }
    }

    function stopCameraTest() {
      try {testVideo.pause();} catch (_) {}
      testStream?.getTracks().forEach(track => track.stop());
      testStream = null;
      testVideo.srcObject = null;
      testLayer.style.display = 'none';
      showHome('Camera test complete. Tap Start AR to try image tracking.');
    }

    startButton.addEventListener('click', startAR);
    $('close').addEventListener('click', stopAR);
    $('cameraTest').addEventListener('click', startCameraTest);
    $('testFromAr').addEventListener('click', startCameraTest);
    $('endTest').addEventListener('click', stopCameraTest);
    retryButton.addEventListener('click', () => {
      if (!targetFound) return;
      video.play().then(() => {
        retryButton.hidden = true;
        setStatus('Video playing ✓');
      }).catch(() => setStatus('Tap again to allow video.'));
    });
    soundButton.addEventListener('click', () => {
      video.muted = !video.muted;
      soundButton.textContent = video.muted ? 'Enable sound' : 'Mute sound';
      if (targetFound && video.paused) video.play().catch(() => {retryButton.hidden = false;});
    });
    window.addEventListener('pagehide', () => {
      try {tracker?.renderer.setAnimationLoop(null);tracker?.stop();} catch (_) {}
      testStream?.getTracks().forEach(track => track.stop());
      video.pause();
    });
    introStatus.textContent = 'Ready. Tap Start AR. If the view is black, tap Test back camera.';
  </script>
  <script>
    // If CDN import fails, show a readable error instead of a dead button.
    window.addEventListener('error', event => {
      const m = String(event?.message || '');
      if (/module|fetch|script|import|cross.origin/i.test(m)) {
        document.getElementById('introStatus').textContent = 'Could not load the AR library. Check internet or try Safari over Wi-Fi.';
      }
    });
  </script>
</body>
</html>
