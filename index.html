<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Silent Colors AR</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081b36;font-family:Arial,sans-serif;color:white}
#startScreen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box;padding:22px;text-align:center;background:#081b36}
#startScreen img{width:min(65vw,300px);max-height:43vh;object-fit:contain;border-radius:16px}
h1{font-size:clamp(26px,7vw,40px);margin:22px 0 12px}p{max-width:440px;line-height:1.5}button{padding:15px 30px;border:0;border-radius:14px;font-size:20px;font-weight:bold;background:white;color:#082449}button:disabled{opacity:.55}#status{margin-top:16px;max-width:440px;overflow-wrap:anywhere;font-size:14px;line-height:1.5;color:#d5dfec}
#arScene{position:fixed;inset:0;width:100%;height:100%}#back{position:fixed;z-index:15;top:calc(14px + env(safe-area-inset-top));left:14px;display:none;padding:10px 14px;font-size:15px}
</style>
</head>
<body>
<div id="startScreen">
<img src="./assets/silent-colors-target.jpg" alt="Silent Colors painting">
<h1>Silent Colors AR</h1>
<p>Tap Start AR, then point your camera at the painting. The video will appear over the artwork.</p>
<button id="startButton" type="button">Start AR</button>
<div id="status">Internet connection is required to load AR.</div>
</div>
<button id="back" type="button">Close AR</button>
<a-scene id="arScene" mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no;" embedded color-space="sRGB" renderer="colorManagement: true;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
<a-assets timeout="20000"><video id="arVideo" src="./assets/silent-colors-video.mp4" preload="auto" loop muted playsinline webkit-playsinline></video></a-assets>
<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
<a-entity id="target" mindar-image-target="targetIndex: 0"><a-video src="#arVideo" position="0 0 0.01" width="1" height="1.23"></a-video></a-entity>
</a-scene>
<script>
const scene=document.getElementById('arScene');
const startButton=document.getElementById('startButton');
const startScreen=document.getElementById('startScreen');
const statusEl=document.getElementById('status');
const video=document.getElementById('arVideo');
const back=document.getElementById('back');
const target=document.getElementById('target');
function sceneReady(){return new Promise((resolve,reject)=>{if(scene.hasLoaded)return resolve();const timer=setTimeout(()=>reject(new Error('AR scene did not finish loading. Check your internet connection and reload.')),30000);scene.addEventListener('loaded',()=>{clearTimeout(timer);resolve()},{once:true});});}
async function checkAsset(path){const response=await fetch(path,{method:'GET',cache:'no-store'});if(!response.ok)throw new Error('Missing file: '+path+' (HTTP '+response.status+'). Check the filename and GitHub folder.');}
startButton.addEventListener('click',async()=>{
 startButton.disabled=true;statusEl.textContent='Checking AR files...';
 try{
  if(!window.isSecureContext)throw new Error('Camera requires HTTPS.');
  if(!navigator.mediaDevices?.getUserMedia)throw new Error('This browser does not support camera access. Try Safari.');
  if(!window.AFRAME)throw new Error('A-Frame library failed to load.');
  await Promise.all([checkAsset('./targets.mind'),checkAsset('./assets/silent-colors-video.mp4')]);
  statusEl.textContent='Initializing AR...';
  await sceneReady();
  const system=scene.systems['mindar-image-system'];
  if(!system)throw new Error('MindAR did not initialize. Check the library connection.');
  // iOS allows muted inline video to begin during the user gesture.
  try{await video.play();video.pause();video.currentTime=0;}catch(e){console.warn('Video priming:',e);}
  statusEl.textContent='Starting camera...';
  await system.start();
  startScreen.style.display='none';back.style.display='block';
 }catch(error){console.error('AR startup error:',error);statusEl.textContent='AR error: '+(error?.message||String(error));startButton.disabled=false;try{scene.systems['mindar-image-system']?.stop()}catch(e){}}
});
target.addEventListener('targetFound',()=>{video.play().catch(e=>console.error('Video playback:',e));});
target.addEventListener('targetLost',()=>{video.pause();});
back.addEventListener('click',()=>{video.pause();try{scene.systems['mindar-image-system']?.stop()}catch(e){}back.style.display='none';startScreen.style.display='flex';startButton.disabled=false;statusEl.textContent='Ready to start again.';});
</script>
</body>
</html>
