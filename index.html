<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061b32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Silent Colors AR - Version 10</title>

<!-- Three.js and MindAR: loaded from the internet when this page opens. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>

<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  button { font: inherit; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }

  #stage {
    position: fixed; inset: 0; z-index: 1;
    width: 100vw; height: 100vh; height: 100dvh;
    overflow: hidden; background: #000;
  }
  /* The camera and GL canvas are positioned by MindAR. Do not move them. */
  #stage canvas { pointer-events: none; background: transparent !important; }

  /* IMPORTANT: iOS can stop an off-screen/display:none video.
     Keep the video element technically visible but extremely small.
     Its pixels are displayed in the AR mesh, not here. */
  #arVideo {
    position: fixed; z-index: 2; left: 0; top: 0;
    width: 2px; height: 2px; opacity: .015;
    pointer-events: none;
  }

  #welcome {
    position: fixed; inset: 0; z-index: 20; overflow-y: auto;
    padding: max(20px, env(safe-area-inset-top)) 22px max(20px, env(safe-area-inset-bottom));
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    background: radial-gradient(circle at 50% 10%, #183b63, #081d38 57%, #061427);
  }
  #welcomeInner { width: 100%; max-width: 430px; margin: auto; }
  #artwork {
    display: block; width: min(58vw, 280px); max-height: 42dvh;
    height: auto; object-fit: contain; margin: 0 auto 21px;
    border-radius: 15px; box-shadow: 0 16px 36px #0007;
  }
  h1 { margin: 0 0 12px; font-size: clamp(30px, 7vw, 40px); letter-spacing: -.035em; }
  #intro { margin: 0 auto 24px; line-height: 1.5; font-size: 16px; color: #dceafa; }
  #startBtn {
    width: 100%; min-height: 61px; border-radius: 18px;
    padding: 16px; background: #fff; color: #072444;
    font-size: 21px; font-weight: 750;
  }
  #startBtn:disabled { opacity: .65; }
  #loadStatus {
    min-height: 22px; margin: 16px 0 0;
    color: #c7dff5; line-height: 1.5; font-size: 13px; overflow-wrap: anywhere;
  }
  #details {
    margin-top: 12px; padding: 9px; background: #0005;
    border-radius: 9px; text-align: left; white-space: pre-wrap;
    overflow-wrap: anywhere; font-size: 12px;
  }
  #version { display: block; margin-top: 15px; color: #91b0cf; font-size: 12px; }

  #hud { position: fixed; inset: 0; z-index: 10; display: none; pointer-events: none; }
  #exitBtn {
    position: absolute; top: calc(env(safe-area-inset-top) + 14px); left: 16px;
    padding: 11px 18px; min-height: 46px; border-radius: 100px;
    background: #071b36de; color: #fff;
    border: 1px solid #ffffff50; font-size: 16px; font-weight: 700;
    pointer-events: auto;
  }
  #hint {
    position: absolute; left: 18px; right: 18px;
    bottom: calc(env(safe-area-inset-bottom) + 24px);
    padding: 13px; line-height: 1.4; border-radius: 15px;
    text-align: center; font-size: 15px; background: #081d38e6;
  }
</style>
</head>
<body>
  <div id="stage" aria-label="Rear-camera AR view"></div>

  <!-- Same file path as your existing GitHub repository.
       Use H.264 MP4 (yuv420p) for iPhone Safari; muted autoplay is supported. -->
  <video id="arVideo" muted autoplay loop playsinline webkit-playsinline preload="auto" crossorigin="anonymous">
    <source src="./assets/silent-colors-video.mp4?v=10" type="video/mp4">
  </video>

  <main id="welcome">
    <div id="welcomeInner">
      <img id="artwork" src="./assets/silent-colors-target.jpg" alt="Silent Colors target painting">
      <h1>Silent Colors AR</h1>
      <p id="intro">Tap Start AR, then aim the rear camera at the painting. The animation floats beside the artwork.</p>
      <button id="startBtn" type="button" disabled>Loading AR...</button>
      <div id="loadStatus" aria-live="polite">Loading image tracking...</div>
      <div id="details" hidden></div>
      <small id="version">Version 10 - restart animation at 0:00 on every image detection</small>
    </div>
  </main>

  <div id="hud">
    <button id="exitBtn" type="button">&larr; Close AR</button>
    <div id="hint" aria-live="polite">Aim the rear camera at the entire painting.</div>
  </div>

<script type="module">
  const $ = (id) => document.getElementById(id);
  const stage = $('stage');
  const welcome = $('welcome');
  const hud = $('hud');
  const artwork = $('artwork');
  const startBtn = $('startBtn');
  const loadStatus = $('loadStatus');
  const details = $('details');
  const hint = $('hint');
  const video = $('arVideo');

  // POSITION SETTINGS: relative to the recognized image, not the phone screen.
  // MindAR uses 1.0 as the target image width.
  const FLOAT_WIDTH = 0.48;       // 48% of the painting width
  const GAP_FROM_TARGET = 0.04;   // close to the painting, without covering it
  const FLOAT_SIDE = 'left';      // change to 'right' if preferred
  const MAX_HEIGHT_RATIO = 0.73; // relative to target image height

  // Remove the MP4's BLACK background (a regular MP4 contains no transparency).
  // Lower CUT_DARK to preserve darker animation details; raise to hide dark borders.
  const CUT_DARK = 0.004;
  const CUT_SOFT = 0.040;

  const TARGETS_FILE = './targets.mind';
  const TARGET_IMAGE_FILE = './assets/silent-colors-target.jpg';
  const VIDEO_FILE = './assets/silent-colors-video.mp4?v=10';

  let THREE, MindARThree, mindar, anchor, movieMesh, movieTexture;
  let isStarting = false, isStarted = false, targetFound = false;
  let hasVideoFrame = false, lastFrameTime = -1;
  let playInFlight = null, playError = null;
  let lostTimer = null, waitTimer = null;

  video.muted = true;
  video.defaultMuted = true;
  video.playsInline = true;
  video.setAttribute('muted', '');
  video.setAttribute('playsinline', '');
  video.setAttribute('webkit-playsinline', '');

  function showHint(message) {
    hint.textContent = message;
    hint.hidden = false;
  }

  function failBeforeStarting(message, error) {
    console.error(message, error);
    loadStatus.textContent = message;
    details.textContent = error ? String(error?.message || error) : '';
    details.hidden = !error;
    startBtn.disabled = false;
    startBtn.textContent = 'Try Start AR';
  }

  function mediaErrorDescription() {
    const err = video.error;
    const code = err?.code;
    if (code === 4) return 'This MP4 is not supported on iPhone. Export H.264 (AVC), yuv420p.';
    if (code === 3) return 'The iPhone cannot decode this MP4. Export as H.264.';
    if (code === 2) return 'Video download failed. Check assets/silent-colors-video.mp4.';
    return playError?.name === 'NotAllowedError'
      ? 'Your browser blocked playback. Tap the screen once to unlock the animation.'
      : 'Video is not playing. Tap the screen once; if needed check the MP4 file.';
  }

  // On iPhone, the first call to play() is safest INSIDE the Start AR tap.
  // We therefore play the silent video before asking for camera permission.
  // Its content is invisible until the artwork is recognized.
  function playVideo() {
    if (!video.paused && !video.ended) return Promise.resolve(true);
    if (playInFlight) return playInFlight;

    video.muted = true;
    video.defaultMuted = true;
    video.setAttribute('muted', '');
    try {
      const promise = video.play(); // The call itself must happen during the click.
      playInFlight = Promise.resolve(promise)
        .then(() => {
          playError = null;
          updateMovieVisibility();
          return true;
        })
        .catch((error) => {
          playError = error;
          console.warn('Video play() failed:', error);
          if (isStarted && targetFound) showHint(mediaErrorDescription());
          return false;
        })
        .finally(() => { playInFlight = null; });
      return playInFlight;
    } catch (error) {
      playError = error;
      if (isStarted && targetFound) showHint(mediaErrorDescription());
      return Promise.resolve(false);
    }
  }

  function updateMovieVisibility() {
    if (!movieMesh) return;
    // A black video texture before decoding must NEVER appear as a black panel.
    const canDraw = isStarted && targetFound && hasVideoFrame && !video.paused && !video.seeking;
    movieMesh.visible = canDraw;
    if (canDraw) hint.hidden = true;
  }

  function onVideoFrame() {
    hasVideoFrame = true;
    updateMovieVisibility();
  }

  // A decoded video frame is the reliable sign that a texture can be displayed.
  if (typeof video.requestVideoFrameCallback === 'function') {
    const frameCallback = () => {
      onVideoFrame();
      video.requestVideoFrameCallback(frameCallback);
    };
    video.requestVideoFrameCallback(frameCallback);
  } else {
    // Older Safari fallback.
    video.addEventListener('timeupdate', () => {
      if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) onVideoFrame();
    });
  }
  video.addEventListener('playing', () => {
    playError = null;
    if (targetFound && !hasVideoFrame) showHint('Painting found. Loading animation frame...');
    updateMovieVisibility();
  });
  video.addEventListener('loadeddata', () => {
    // This also helps browsers that deliver a first image before video time advances.
    if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) onVideoFrame();
  });
  // Do not display a stale frame while Safari seeks back to the start.
  video.addEventListener('seeking', () => {
    hasVideoFrame = false;
    updateMovieVisibility();
  });
  video.addEventListener('seeked', () => {
    hasVideoFrame = false;
    updateMovieVisibility();
  });
  video.addEventListener('error', () => {
    console.error('MP4 error:', video.error?.code, video.currentSrc);
    if (targetFound && isStarted) showHint(mediaErrorDescription());
  });

  function placeAnimation() {
    if (!movieMesh) return;

    const targetAspect = artwork.naturalWidth && artwork.naturalHeight
      ? artwork.naturalHeight / artwork.naturalWidth : 1;
    const movieAspect = video.videoWidth && video.videoHeight
      ? video.videoWidth / video.videoHeight : 1;

    const maximumHeight = Math.max(0.3, targetAspect * MAX_HEIGHT_RATIO);
    const width = Math.min(FLOAT_WIDTH, maximumHeight * movieAspect);
    const height = width / movieAspect;
    const side = FLOAT_SIDE === 'right' ? 1 : -1;

    movieMesh.scale.set(width, height, 1);
    movieMesh.position.set(
      side * (0.5 + GAP_FROM_TARGET + width / 2),
      -targetAspect / 2 + height / 2 + 0.04,
      0.055
    );
  }

  video.addEventListener('loadedmetadata', placeAnimation);
  artwork.addEventListener('load', placeAnimation);

  function makeTracker() {
    if (mindar) return mindar;

    mindar = new MindARThree({
      container: stage,
      imageTargetSrc: TARGETS_FILE,
      uiLoading: 'no', uiScanning: 'no', uiError: 'no',
      maxTrack: 1,
      filterMinCF: 0.001,
      filterBeta: 30
    });
    anchor = mindar.addAnchor(0);
    anchor.onTargetFound = foundTarget;
    anchor.onTargetLost = lostTarget;

    movieTexture = new THREE.VideoTexture(video);
    movieTexture.colorSpace = THREE.SRGBColorSpace;
    movieTexture.minFilter = THREE.LinearFilter;
    movieTexture.magFilter = THREE.LinearFilter;
    movieTexture.generateMipmaps = false;

    // Black-screen key: ordinary MP4 has no alpha channel, so remove near-black
    // pixels directly in the GPU. Other painted colors remain visible.
    const material = new THREE.MeshBasicMaterial({
      map: movieTexture,
      side: THREE.DoubleSide,
      transparent: true,
      alphaTest: 0.015,
      depthWrite: false,
      toneMapped: false
    });
    material.onBeforeCompile = (shader) => {
      shader.fragmentShader = shader.fragmentShader.replace(
        '#include <map_fragment>',
        '#include <map_fragment>\n' +
        'float bright = max(diffuseColor.r, max(diffuseColor.g, diffuseColor.b));\n' +
        `diffuseColor.a *= smoothstep(${CUT_DARK.toFixed(4)}, ${CUT_SOFT.toFixed(4)}, bright);\n`
      );
    };

    movieMesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), material);
    movieMesh.visible = false;
    movieMesh.frustumCulled = false;
    anchor.group.add(movieMesh);
    placeAnimation();

    mindar.renderer.setClearColor(0x000000, 0);
    mindar.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
    mindar.renderer.domElement.style.background = 'transparent';
    return mindar;
  }

  // Restart every time a new image-tracking session recognizes the painting.
  // The silent video is pre-warmed by the Start AR tap for Safari autoplay,
  // but is invisible until tracking. Seeking here prevents mid-video starts.
  function restartVideoAtZero() {
    const seekAndPlay = () => {
      if (!targetFound) return;
      try {
        video.currentTime = 0;
        lastFrameTime = -1;
      } catch (error) {
        console.warn('Could not seek to the first frame:', error);
      }
      void playVideo();
    };

    if (video.readyState >= HTMLMediaElement.HAVE_METADATA) {
      seekAndPlay();
    } else {
      // Safari can report the target before the MP4 metadata is available.
      video.addEventListener('loadedmetadata', seekAndPlay, { once: true });
      void playVideo();
    }
  }

  function foundTarget() {
    clearTimeout(lostTimer);
    clearTimeout(waitTimer);
    if (targetFound) return; // Ignore duplicate tracking events.
    targetFound = true;

    // Hide the previous video frame until the seek has finished.
    hasVideoFrame = false;
    lastFrameTime = -1;
    updateMovieVisibility();
    showHint('Painting found. Starting animation from 0:00...');
    restartVideoAtZero();

    waitTimer = setTimeout(() => {
      if (isStarted && targetFound && !movieMesh?.visible) {
        showHint(mediaErrorDescription());
      }
    }, 4500);
  }

  function lostTarget() {
    clearTimeout(lostTimer);
    clearTimeout(waitTimer);
    lostTimer = setTimeout(() => {
      targetFound = false;
      updateMovieVisibility();
      if (isStarted) showHint('Point the rear camera at the entire painting.');
    }, 500);
  }

  async function checkFiles() {
    for (const path of [TARGETS_FILE, TARGET_IMAGE_FILE, VIDEO_FILE]) {
      const response = await fetch(path, { method: 'HEAD', cache: 'no-store' });
      if (!response.ok) throw new Error(`${path} returned HTTP ${response.status}`);
    }
  }

  async function startAR() {
    if (isStarting || isStarted) return;
    if (!THREE || !MindARThree) {
      failBeforeStarting('AR libraries are still loading. Please reload the page.');
      return;
    }
    if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
      failBeforeStarting('Open the HTTPS GitHub Pages site and allow the rear camera.');
      return;
    }

    isStarting = true;
    startBtn.disabled = true;
    startBtn.textContent = 'Opening camera...';
    loadStatus.textContent = 'Preparing camera and image tracking...';
    details.hidden = true;

    // This playback request happens synchronously in the Start AR click.
    void playVideo();

    try {
      await checkFiles();
      const ar = makeTracker();
      await ar.start();
      ar.renderer.setAnimationLoop(() => {
        // Backup for VideoTexture in Safari if frame callback is delayed.
        if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA && !video.paused) {
          if (video.currentTime !== lastFrameTime) {
            lastFrameTime = video.currentTime;
            movieTexture.needsUpdate = true;
            if (!hasVideoFrame && video.currentTime > 0) onVideoFrame();
          }
        }
        ar.renderer.render(ar.scene, ar.camera);
      });

      isStarted = true;
      welcome.style.display = 'none';
      hud.style.display = 'block';
      showHint('Point the rear camera at the Silent Colors painting.');
      if (targetFound) {
        // If tracking finished before the camera UI was ready, restart now.
        hasVideoFrame = false;
        updateMovieVisibility();
        restartVideoAtZero();
        if (!movieMesh?.visible) {
          showHint('Painting detected. Loading animation...');
          waitTimer = setTimeout(() => {
            if (isStarted && targetFound && !movieMesh?.visible) {
              showHint(mediaErrorDescription());
            }
          }, 4500);
        }
      }
      window.dispatchEvent(new Event('resize'));
    } catch (error) {
      try { await mindar?.stop(); } catch (_) {}
      failBeforeStarting('Cannot start AR. Check your uploaded files and camera permission.', error);
    } finally {
      isStarting = false;
      if (!isStarted) {
        video.pause();
        startBtn.disabled = false;
        startBtn.textContent = 'Try Start AR';
      }
    }
  }

  async function closeAR() {
    clearTimeout(lostTimer);
    clearTimeout(waitTimer);
    isStarted = false;
    targetFound = false;
    updateMovieVisibility();
    try { mindar?.renderer?.setAnimationLoop(null); } catch (_) {}
    try { await mindar?.stop(); } catch (err) { console.warn(err); }
    video.pause();
    hud.style.display = 'none';
    welcome.style.display = 'flex';
    startBtn.disabled = false;
    startBtn.textContent = 'Start AR';
    loadStatus.textContent = 'Ready to scan again.';
  }

  startBtn.addEventListener('click', () => { void startAR(); });
  $('exitBtn').addEventListener('click', () => { void closeAR(); });

  // There is NO Play Video button. This is only a Safari backup:
  // one tap anywhere if the operating system blocked even muted playback.
  document.addEventListener('pointerdown', (event) => {
    if (!isStarted || !targetFound || !video.paused) return;
    if (event.target === $('exitBtn')) return;
    void playVideo();
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && isStarted && video.paused) void playVideo();
  });
  window.addEventListener('pagehide', () => {
    clearTimeout(waitTimer);
    clearTimeout(lostTimer);
    video.pause();
    try { mindar?.stop(); } catch (_) {}
  });

  (async () => {
    try {
      const [threeMod, mindarMod] = await Promise.all([
        import('three'), import('mindar-image-three')
      ]);
      THREE = threeMod;
      MindARThree = mindarMod.MindARThree;
      if (!THREE?.VideoTexture || !MindARThree) throw new Error('AR module missing');
      startBtn.disabled = false;
      startBtn.textContent = 'Start AR';
      loadStatus.textContent = 'Ready. Tap Start AR to open your back camera.';
    } catch (error) {
      failBeforeStarting('Could not load AR libraries. Connect to the internet and reload.', error);
    }
  })();
</script>
</body>
</html>
