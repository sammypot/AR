<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#081a33" />
  <title>Silent Colors AR</title>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071427;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    #app{position:fixed;inset:0}
    #cover{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#071427,#102b4e);color:white;padding:24px;box-sizing:border-box}
    .card{width:min(92vw,480px);text-align:center}.card img{width:min(58vw,250px);max-height:42vh;object-fit:contain;border-radius:12px;box-shadow:0 12px 36px #0008}
    h1{margin:16px 0 8px;font-size:28px}.lead{opacity:.88;line-height:1.45;margin:0 0 18px}
    button{appearance:none;border:0;border-radius:14px;background:#fff;color:#0a2342;font-weight:800;font-size:17px;padding:14px 22px;min-width:210px;box-shadow:0 8px 24px #0005}
    button:disabled{opacity:.55}.small{font-size:13px;opacity:.72;margin-top:14px}
    #status{position:fixed;z-index:15;left:50%;top:18px;transform:translateX(-50%);background:#061528d9;color:#fff;padding:10px 15px;border-radius:999px;font-size:14px;white-space:nowrap;pointer-events:none}
    #hint{position:fixed;z-index:15;left:20px;right:20px;bottom:24px;text-align:center;color:#fff;background:#061528cc;padding:11px 14px;border-radius:14px;font-size:14px;pointer-events:none}
    a-scene{position:fixed!important;inset:0!important}
  </style>
</head>
<body>
<div id="app"></div>
<div id="cover">
  <div class="card">
    <img src="assets/silent-colors-target.jpg" alt="Silent Colors target artwork" />
    <h1>Silent Colors AR</h1>
    <p class="lead">Tap Start, allow camera access, then point your phone at this artwork. The video will appear over it.</p>
    <button id="startBtn">Start AR</button>
    <div id="compileText" class="small">The first load prepares the artwork for tracking.</div>
  </div>
</div>
<div id="status" hidden>Preparing…</div>
<div id="hint" hidden>Point your camera at the Silent Colors artwork</div>

<script>
(async function(){
  const btn=document.getElementById('startBtn');
  const cover=document.getElementById('cover');
  const status=document.getElementById('status');
  const hint=document.getElementById('hint');
  const compileText=document.getElementById('compileText');

  const loadImage=(src)=>new Promise((resolve,reject)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>resolve(i);i.onerror=reject;i.src=src;});
  let mindURL=null;

  async function prepareTarget(){
    compileText.textContent='Preparing tracking data…';
    const image=await loadImage('assets/silent-colors-target.jpg');
    const compiler=new window.MINDAR.Compiler();
    await compiler.compileImageTargets([image],(p)=>{compileText.textContent=`Preparing tracking data… ${Math.round(p)}%`;});
    const buffer=await compiler.exportData();
    mindURL=URL.createObjectURL(new Blob([buffer],{type:'application/octet-stream'}));
    compileText.textContent='Ready.';
  }

  try{ await prepareTarget(); }
  catch(e){ console.error(e); compileText.textContent='Could not prepare AR. Check your internet connection and reload.'; btn.disabled=true; return; }

  btn.addEventListener('click', async()=>{
    btn.disabled=true; status.hidden=false; status.textContent='Starting camera…';

    // The user gesture also unlocks media playback on mobile browsers.
    const video=document.createElement('video');
    video.id='arVideo'; video.src='assets/silent-colors-video.mp4'; video.preload='auto'; video.loop=true; video.playsInline=true; video.setAttribute('webkit-playsinline',''); video.crossOrigin='anonymous';
    video.style.display='none'; document.body.appendChild(video);
    try{ video.muted=true; await video.play(); video.pause(); video.currentTime=0; video.muted=false; }catch(e){ console.log('Video unlock deferred',e); }

    const scene=document.createElement('a-scene');
    scene.setAttribute('mindar-image',`imageTargetSrc: ${mindURL}; autoStart: true; uiLoading: yes; uiScanning: no; uiError: yes; filterMinCF: 0.001; filterBeta: 1000; missTolerance: 5; warmupTolerance: 5`);
    scene.setAttribute('color-space','sRGB');
    scene.setAttribute('renderer','colorManagement: true; physicallyCorrectLights: true; antialias: true');
    scene.setAttribute('vr-mode-ui','enabled: false');
    scene.setAttribute('device-orientation-permission-ui','enabled: false');
    scene.innerHTML=`
      <a-assets timeout="20000"><video id="videoAsset" src="assets/silent-colors-video.mp4" preload="auto" loop playsinline webkit-playsinline crossorigin="anonymous"></video></a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity id="target" mindar-image-target="targetIndex: 0">
        <a-video id="videoPlane" src="#videoAsset" position="0 0 0.01" width="1" height="1.22782"></a-video>
      </a-entity>`;
    document.getElementById('app').appendChild(scene);

    const target=scene.querySelector('#target');
    const asset=scene.querySelector('#videoAsset');
    asset.muted=false;

    target.addEventListener('targetFound',async()=>{
      status.textContent='Artwork detected — playing video'; hint.hidden=true;
      try{ await asset.play(); }catch(e){ asset.muted=true; try{await asset.play(); status.textContent='Artwork detected — video playing (muted)';}catch(_){} }
    });
    target.addEventListener('targetLost',()=>{
      status.textContent='Find the artwork again'; hint.hidden=false;
      try{ asset.pause(); }catch(e){}
    });
    scene.addEventListener('arReady',()=>{ status.textContent='Camera ready'; hint.hidden=false; });
    scene.addEventListener('arError',(e)=>{ status.textContent='Camera error — reload and allow camera access'; console.error(e); });

    cover.style.display='none';
    setTimeout(()=>{ if(status.textContent==='Camera ready') status.hidden=true; },2500);
  });
})();
</script>
</body>
</html>
