<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061b32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Silent Colors AR</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.147.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>
<style>
  * { box-sizing: border-box; }
  html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#000; color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  button { border:0; font:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none!important; }

  /* The MindAR rear-camera stream and its tracking canvas fill the viewport. */
  #stage { position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; overflow:hidden; z-index:1; background:#000; }
  #stage video { position:absolute!important; top:50%!important; left:50%!important; width:100%!important; height:100%!important; min-width:100%!important; min-height:100%!important; object-fit:cover!important; transform:translate(-50%,-50%)!important; display:block!important; z-index:1!important; }
  #stage canvas { position:absolute!important; inset:0!important; width:100%!important; height:100%!important; display:block!important; background:transparent!important; z-index:2!important; pointer-events:none; }

  /* Fullscreen video appears only after the painting has been recognized. */
  #videoLayer { position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; z-index:5; background:#000; display:none; overflow:hidden; }
  #videoLayer.shown { display:block; }
  #arVideo { width:100%; height:100%; display:block; object-fit:cover; object-position:center; background:#000; }

  #welcome { position:fixed; inset:0; z-index:20; overflow-y:auto; padding:max(20px,env(safe-area-inset-top)) 22px max(20px,env(safe-area-inset-bottom)); display:flex; align-items:center; justify-content:center; text-align:center; background:radial-gradient(circle at 50% 10%,#183b63,#081d38 57%,#061427); }
  #welcomeInner { width:100%; max-width:430px; margin:auto; }
  #artwork { width:min(58vw,280px); max-height:42dvh; height:auto; display:block; object-fit:contain; margin:0 auto 21px; border-radius:15px; box-shadow:0 16px 36px #0007; }
  h1 { margin:0 0 12px; font-size:clamp(30px,7vw,40px); letter-spacing:-.035em; }
  #intro { font-size:16px; color:#dceafa; line-height:1.5; margin:0 auto 24px; }
  #startBtn { width:100%; min-height:61px; background:#fff; color:#072444; border-radius:18px; font-size:21px; font-weight:750; padding:16px; }
  #startBtn:disabled { opacity:.65; }
  #loadStatus { font-size:13px; color:#c7dff5; line-height:1.5; min-height:22px; margin:16px 0 0; overflow-wrap:anywhere; }
  #version { display:block; font-size:12px; color:#91b0cf; margin-top:15px; }
  #details { white-space:pre-wrap; overflow-wrap:anywhere; margin-top:12px; padding:9px; border-radius:9px; background:#0005; text-align:left; font-size:12px; }

  #hud { position:fixed; inset:0; z-index:10; display:none; pointer-events:none; }
  #exitBtn { position:absolute; left:16px; top:calc(env(safe-area-inset-top) + 14px); min-height:46px; padding:11px 18px; border-radius:100px; color:#fff; background:#071b36d9; border:1px solid #ffffff50; font-size:16px; font-weight:700; pointer-events:auto; }
  #hint { position:absolute; left:18px; right:18px; bottom:calc(env(safe-area-inset-bottom) + 24px); border-radius:15px; background:#081d38d9; padding:14px; line-height:1.45; text-align:center; font-size:15px; }
  #soundBtn { position:absolute; right:16px; bottom:calc(env(safe-area-inset-bottom) + 22px); min-height:45px; border-radius:100px; background:#ffffffed; color:#071b36; font-size:14px; font-weight:700; padding:11px 16px; pointer-events:auto; }
</style>
</head>
<body>
  <div id="stage" aria-label="Live rear camera AR view"></div>

  <div id="videoLayer" aria-label="Silent Colors fullscreen video">
    <video id="arVideo" preload="auto" muted playsinline webkit-playsinline loop
           poster="./assets/silent-colors-target.jpg">
      <source src="./assets/silent-colors-video.mp4?v=6" type="video/mp4">
    </video>
  </div>

  <main id="welcome">
    <div id="welcomeInner">
      <img id="artwork" src="./assets/silent-colors-target.jpg" alt="Silent Colors painting">
      <h1>Silent Colors AR</h1>
      <p id="intro">Point your back camera at this artwork. The video will play automatically in full screen.</p>
      <button id="startBtn" type="button" disabled>Loading AR...</button>
      <div id="loadStatus" aria-live="polite">Preparing image tracking...</div>
      <div id="details" hidden></div>
      <small id="version">Version 6 - automatic video</small>
    </div>
  </main>

  <div id="hud">
    <button id="exitBtn" type="button">&larr; Exit AR</button>
    <div id="hint" aria-live="polite">Point the back camera at the Silent Colors painting</div>
    <button id="soundBtn" type="button" hidden>Enable sound</button>
  </div>

<script type="module">
  const el = id => document.getElementById(id);
  const stage = el('stage'), welcome = el('welcome'), hud = el('hud');
  const startBtn = el('startBtn'), loadStatus = el('loadStatus'), details = el('details');
  const videoLayer = el('videoLayer'), video = el('arVideo'), hint = el('hint');
  const soundBtn = el('soundBtn');
  let MindARThree, mindar, started = false, starting = false, found = false;
  let lostTimeout = null, playingPromise = null, needsTap = false;
  let videoError = null;

  // Playback always starts muted: automatic playback with sound is restricted by Safari.
  video.muted = true;
  video.defaultMuted = true;
  video.playsInline = true;
  video.setAttribute('muted', '');
  video.setAttribute('playsinline', '');
  video.setAttribute('webkit-playsinline', '');

  function note(msg) {
    hint.textContent = msg;
    hint.hidden = false;
  }
  function failAtHome(msg, err) {
    console.error(msg, err);
    loadStatus.textContent = msg;
    details.textContent = err ? String(err.message || err) : '';
    details.hidden = !err;
    startBtn.disabled = false;
    startBtn.textContent = 'Try AR again';
  }
  function hideVideo() {
    try { video.pause(); } catch (_) {}
    videoLayer.classList.remove('shown');
    soundBtn.hidden = true;
    soundBtn.textContent = 'Enable sound';
    note('Point the back camera at the Silent Colors painting');
  }
  function mediaFailure(err) {
    const code = video.error?.code;
    const name = err?.name || '';
    console.error('Silent Colors video failed', {name, code, error:err, src:video.currentSrc});
    videoLayer.classList.remove('shown');
    soundBtn.hidden = true;
    if (name === 'NotAllowedError') {
      // Low Power Mode or Safari settings may require one additional screen touch.
      needsTap = true;
      note('Safari prevented autoplay. Tap anywhere once to resume.');
    } else {
      needsTap = false;
      note('Video cannot play. Replace assets/silent-colors-video.mp4 with the new Version 6 MP4.');
    }
  }
  async function tryAutomaticPlayback() {
    if (!started || !found) return;
    videoLayer.classList.add('shown'); // Make video visible BEFORE play() on iPhone.
    video.muted = true;
    video.defaultMuted = true;
    video.setAttribute('muted', '');
    soundBtn.textContent = 'Enable sound';
    note('Painting detected. Starting video...');
    if (playingPromise) return playingPromise;
    try {
      playingPromise = video.play();
      if (playingPromise) await playingPromise;
      if (!found || !started) { hideVideo(); return; }
      needsTap = false;
      hint.hidden = true;
      soundBtn.hidden = false;
    } catch (err) {
      if (found && started) mediaFailure(err);
    } finally {
      playingPromise = null;
    }
  }
  function onFound() {
    clearTimeout(lostTimeout);
    lostTimeout = null;
    if (found) return;
    found = true;
    if (video.readyState >= 1) {
      try { video.currentTime = 0; } catch (_) {}
    }
    void tryAutomaticPlayback();
  }
  function onLost() {
    clearTimeout(lostTimeout);
    lostTimeout = setTimeout(() => {
      found = false;
      needsTap = false;
      hideVideo();
    }, 850);
  }
  function initializeTracker() {
    if (mindar) return mindar;
    mindar = new MindARThree({
      container:stage,
      imageTargetSrc:'./targets.mind',
      uiLoading:'no', uiScanning:'no', uiError:'no',
      filterMinCF:0.001, filterBeta:100
    });
    const anchor = mindar.addAnchor(0);
    anchor.onTargetFound = onFound;
    anchor.onTargetLost = onLost;
    mindar.renderer.setClearColor(0x000000, 0);
    mindar.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    mindar.renderer.domElement.style.background = 'transparent';
    return mindar;
  }
  async function assertFiles() {
    for (const path of ['./targets.mind', './assets/silent-colors-video.mp4?v=6']) {
      const response = await fetch(path, {method:'HEAD', cache:'no-store'});
      if (!response.ok) throw new Error(path + ': HTTP ' + response.status);
    }
  }
  async function startAR() {
    if (starting || started) return;
    if (!MindARThree) { failAtHome('AR library is not ready. Reload in Safari.'); return; }
    if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
      failAtHome('Camera access requires HTTPS and Safari.'); return;
    }
    starting = true;
    startBtn.disabled = true;
    startBtn.textContent = 'Opening camera...';
    loadStatus.textContent = 'Loading image target and starting rear camera...';
    video.muted = true;
    video.defaultMuted = true;
    video.load(); // Ask Safari to load video metadata during the Start AR gesture.
    try {
      await assertFiles();
      const tracker = initializeTracker();
      await tracker.start();
      tracker.renderer.setAnimationLoop(() => tracker.renderer.render(tracker.scene,tracker.camera));
      started = true;
      welcome.style.display = 'none';
      hud.style.display = 'block';
      note('Point the back camera at the Silent Colors painting');
      // Tracking can recognize a target while tracker.start() is still resolving.
      if (found) void tryAutomaticPlayback();
      window.dispatchEvent(new Event('resize'));
    } catch (err) {
      failAtHome('Cannot start AR. Check targets.mind and your connection.', err);
    } finally {
      starting = false;
      if (!started) { startBtn.disabled = false; startBtn.textContent = 'Try AR again'; }
    }
  }
  function exitAR() {
    clearTimeout(lostTimeout);
    lostTimeout = null;
    found = false; needsTap = false;
    hideVideo();
    video.muted = true;
    try { mindar?.renderer?.setAnimationLoop(null); } catch (_) {}
    try { mindar?.stop(); } catch (_) {}
    started = false; starting = false;
    hud.style.display = 'none';
    welcome.style.display = 'flex';
    startBtn.textContent = 'Start AR';
    startBtn.disabled = false;
    loadStatus.textContent = 'Ready to scan again.';
  }

  startBtn.addEventListener('click', startAR);
  el('exitBtn').addEventListener('click', exitAR);
  soundBtn.addEventListener('click', () => {
    if (!found) return;
    video.muted = !video.muted;
    video.defaultMuted = video.muted;
    soundBtn.textContent = video.muted ? 'Enable sound' : 'Mute sound';
    if (video.paused) {
      try { video.play().catch(e => { video.muted = true; mediaFailure(e); }); } catch(e) { mediaFailure(e); }
    }
  });
  document.addEventListener('pointerdown', () => {
    // Fallback only: no extra Play button. A single tap unlocks video on restrictive iPhones.
    if (needsTap && found && started) { needsTap = false; void tryAutomaticPlayback(); }
  });
  video.addEventListener('error', () => {
    videoError = video.error;
    if (found && started) mediaFailure(new Error('Media error code ' + (videoError?.code || 'unknown')));
  });
  window.addEventListener('pagehide', () => {
    clearTimeout(lostTimeout);
    video.pause();
    try { mindar?.stop(); } catch (_) {}
  });
  (async function loadLibrary() {
    try {
      const mod = await import('mindar-image-three');
      MindARThree = mod.MindARThree;
      if (!MindARThree) throw new Error('MindARThree not available');
      startBtn.disabled = false;
      startBtn.textContent = 'Start AR';
      loadStatus.textContent = 'Ready. Scan the painting to play automatically.';
    } catch(err) {
      failAtHome('Cannot load AR libraries. Try Safari on Wi-Fi.', err);
    }
  })();
</script>
</body>
</html>
